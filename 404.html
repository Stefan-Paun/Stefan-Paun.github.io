<style>
/* Eigenständig (kein notes.css): die 404 wird unter jedem Pfad ausgeliefert, deshalb nur absolute Adressen. */
@font-face{font-family:"Archivo";src:url("/fonts/archivo-latin.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --black:#000;--card:#1d1d1f;--text:#f5f5f7;--grey:#86868b;--grey-2:#a1a1a6;--body:#c7c7cc;--hair:rgba(255,255,255,.12);
  --blue:#2997ff;--blue-btn:#0071e3;--blue-btn-hi:#0077ed;--yellow:#FFD23A;--cyan:#35D0FF;--red:#FF4D4D;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Archivo","Helvetica Neue",Arial,sans-serif;
  --gutter:max(22px,env(safe-area-inset-left));
}
*{box-sizing:border-box}
html{background:var(--black);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--black);color:var(--text);font:400 17px/1.6 var(--sf);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
::selection{background:var(--blue-btn);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
.nav{height:52px;background:rgba(22,22,23,.9);border-bottom:1px solid var(--hair)}
.nav .in{width:min(720px,100% - 2*var(--gutter));margin:0 auto;height:100%;display:flex;align-items:center;gap:10px}
.nav a{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:var(--text);text-decoration:none;font-weight:600;font-size:1.1rem;letter-spacing:-.02em}
.nav svg{flex:none}
main{flex:1;display:grid;place-items:center;padding:40px var(--gutter)}
.tile{position:relative;width:100%;max-width:640px;background:var(--card);border-radius:28px;padding:clamp(28px,5vw,48px);overflow:hidden}
.spur{position:absolute;inset:0;pointer-events:none}
.eyebrow{margin:0;color:var(--grey);font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.code{margin:6px 0 0;font-weight:700;font-size:clamp(4rem,16vw,7rem);line-height:1;letter-spacing:-.045em;color:var(--text)}
h1{margin:12px 0 0;font-weight:600;font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.2;letter-spacing:-.02em}
p.t{margin:12px 0 0;max-width:46ch;color:var(--body)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:980px;font-size:1.0625rem;font-weight:500;letter-spacing:-.01em;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn-p{background:var(--blue-btn);color:#fff}
.btn-p:hover{background:var(--blue-btn-hi)}
.btn-s{border:1px solid rgba(255,255,255,.28);color:var(--text)}
.btn-s:hover{border-color:var(--text)}
footer{padding:20px var(--gutter);text-align:center;color:var(--grey);font-size:.875rem}
@media (prefers-reduced-motion:no-preference){
  .spur path{stroke-dasharray:900;stroke-dashoffset:900;animation:spur 1.6s cubic-bezier(.2,.7,.2,1) forwards}
  .spur path:nth-child(2){animation-delay:.15s}
  .spur path:nth-child(3){animation-delay:.3s}
  @keyframes spur{to{stroke-dashoffset:0}}
}
</style>
</head>
<body>
<header class="nav"><div class="in">
  <a href="/" data-de="Stefan Paun, zur Startseite" data-en="Stefan Paun, to the home page" aria-label="Stefan Paun, zur Startseite"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 24 L26 6" stroke="#35D0FF" stroke-width="3.2" stroke-linecap="round"/><path d="M8 24 Q19 21 28 13" stroke="#FFD23A" stroke-width="3.2" stroke-linecap="round" fill="none"/><path d="M8 24 Q17 28 26 28" stroke="#FF4D4D" stroke-width="3.2" stroke-linecap="round" fill="none"/><circle cx="8" cy="24" r="3.4" fill="#f5f5f7"/></svg>Stefan Paun</a>
</div></header>

<main>
  <section class="tile" aria-labelledby="h">
    <svg class="spur" viewBox="0 0 640 360" preserveAspectRatio="xMaxYMax slice" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" opacity=".4">
      <path d="M640 360 L440 40" stroke="#35D0FF"/>
      <path d="M640 360 Q500 300 400 170" stroke="#FFD23A"/>
      <path d="M640 360 Q480 350 330 320" stroke="#FF4D4D"/>
    </svg>
    <p class="eyebrow" data-de="Spur verloren" data-en="Track lost">Spur verloren</p>
    <p class="code" aria-hidden="true">404</p>
    <h1 id="h" data-de="Diese Seite gibt es nicht." data-en="This page does not exist.">Diese Seite gibt es nicht.</h1>
    <p class="t" data-de="Die Adresse ist falsch geschrieben oder die Seite wurde verschoben. Die Projekte findest du auf der Startseite." data-en="The address is misspelled or the page has moved. You will find the projects on the home page.">Die Adresse ist falsch geschrieben oder die Seite wurde verschoben. Die Projekte findest du auf der Startseite.</p>
    <div class="cta">
      <a class="btn btn-p" href="/" data-de="Zur Startseite" data-en="Home page">Zur Startseite</a>
      <a class="btn btn-s" href="/#projekte" data-de="Zu den Projekten" data-en="See the projects">Zu den Projekten</a>
    </div>
  </section>
</main>
<footer data-de="404 · Fehlercode des Servers: Seite nicht gefunden" data-en="404 · server error code: page not found">404 · Fehlercode des Servers: Seite nicht gefunden</footer>
<script>
// Englische Fassung, wenn die fehlende Adresse unter /en/ lag. Ohne JavaScript bleibt alles deutsch.
if (/^\/en(\/|$)/.test(location.pathname)) {
  document.documentElement.lang = "en";
  document.title = "404 · Page not found · Stefan Paun";
  for (const el of document.querySelectorAll("[data-en]")) {
    if (el.hasAttribute("aria-label")) el.setAttribute("aria-label", el.dataset.en);
    else el.textContent = el.dataset.en;
  }
  document.querySelector(".btn-p").href = "/en/";
  document.querySelector(".btn-s").href = "/en/#projekte";
}
</script>
</body>
</html>
